<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EventHub | Event Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#1f2937;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#111827;
    color:white;
    padding:25px 18px;
    z-index:100;
}

.logo{
    font-size:24px;
    font-weight:700;
    padding:0 12px 35px;
}

.logo span{
    color:#3b82f6;
}

.menu-title{
    color:#9ca3af;
    font-size:12px;
    padding:15px 12px 10px;
    text-transform:uppercase;
}

.sidebar button{
    width:100%;
    border:none;
    background:transparent;
    color:#d1d5db;
    padding:13px 15px;
    text-align:left;
    border-radius:8px;
    margin-bottom:5px;
    cursor:pointer;
    font-size:15px;
}

.sidebar button:hover,
.sidebar button.active{
    background:#2563eb;
    color:white;
}

/* ================= MAIN ================= */

.main{
    margin-left:250px;
    min-height:100vh;
}

/* HEADER */

.topbar{
    height:75px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 35px;
    border-bottom:1px solid #e5e7eb;
}

.topbar h2{
    font-size:22px;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* CONTENT */

.content{
    padding:30px 35px;
}

/* ================= DASHBOARD ================= */

.page{
    display:none;
}

.page.active{
    display:block;
}

.welcome{
    margin-bottom:25px;
}

.welcome h1{
    font-size:28px;
    margin-bottom:6px;
}

.welcome p{
    color:#6b7280;
}

/* STAT CARDS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    padding:22px;
    border-radius:14px;
    border:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stat-card h4{
    color:#6b7280;
    font-size:14px;
    margin-bottom:8px;
}

.stat-card h2{
    font-size:28px;
}

.stat-icon{
    width:50px;
    height:50px;
    border-radius:12px;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

/* ================= SECTION ================= */

.panel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:25px;
    margin-bottom:25px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.panel-header h2{
    font-size:19px;
}

/* ================= EVENTS ================= */

.events-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.event-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
    background:white;
    transition:.25s;
}

.event-card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.event-top{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    padding:20px;
}

.event-top h3{
    margin-bottom:8px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    background:rgba(255,255,255,.2);
}

.event-info{
    padding:18px;
}

.info{
    margin-bottom:9px;
    font-size:13px;
    color:#4b5563;
}

.info strong{
    color:#111827;
}

.event-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.event-actions button{
    flex:1;
    padding:9px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

.register{
    background:#16a34a;
    color:white;
}

.edit{
    background:#f59e0b;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
}

.details{
    background:#2563eb;
    color:white;
}

/* ================= BUTTON ================= */

.btn{
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#e5e7eb;
}

/* ================= FORM ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / 3;
}

label{
    margin-bottom:7px;
    font-size:14px;
    font-weight:600;
}

input,
select,
textarea{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
    font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:100px;
    resize:vertical;
}

/* ================= SEARCH ================= */

.search-area{
    display:flex;
    gap:12px;
    margin-bottom:25px;
}

.search-area input{
    flex:1;
}

.search-area select{
    width:180px;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    z-index:200;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:500px;
    max-width:90%;
    border-radius:14px;
    padding:25px;
    position:relative;
}

.close{
    position:absolute;
    right:20px;
    top:15px;
    border:none;
    background:none;
    font-size:25px;
    cursor:pointer;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#111827;
    color:white;
    padding:15px 20px;
    border-radius:8px;
    display:none;
    z-index:300;
}

.toast.show{
    display:block;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .events-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .sidebar{
        width:70px;
        padding:20px 8px;
    }

    .logo{
        font-size:0;
        text-align:center;
    }

    .logo span{
        font-size:20px;
    }

    .sidebar button{
        font-size:0;
        text-align:center;
    }

    .sidebar button::first-letter{
        font-size:20px;
    }

    .main{
        margin-left:70px;
    }

    .content{
        padding:20px;
    }

    .stats,
    .events-grid,
    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:1;
    }

    .search-area{
        flex-direction:column;
    }

    .search-area select{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        Event<span>Hub</span>
    </div>

    <div class="menu-title">Main Menu</div>

    <button class="active" onclick="showPage('dashboard',this)">
        🏠 Dashboard
    </button>

    <button onclick="showPage('events',this)">
        📅 Events
    </button>

    <button onclick="showPage('add',this)">
        ➕ Create Event
    </button>

    <div class="menu-title">Management</div>

    <button onclick="showPage('registrations',this)">
        🎟️ Registrations
    </button>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <header class="topbar">

        <h2 id="pageTitle">Dashboard</h2>

        <div class="profile">
            <div>
                <strong>Event Admin</strong>
            </div>

            <div class="avatar">
                EA
            </div>
        </div>

    </header>


    <div class="content">

        <!-- ================= DASHBOARD ================= -->

        <section id="dashboard" class="page active">

            <div class="welcome">

                <h1>Welcome back 👋</h1>

                <p>
                    Manage your events, registrations and attendees
                    from one place.
                </p>

            </div>


            <div class="stats">

                <div class="stat-card">

                    <div>
                        <h4>Total Events</h4>
                        <h2 id="totalEvents">0</h2>
                    </div>

                    <div class="stat-icon">📅</div>

                </div>


                <div class="stat-card">

                    <div>
                        <h4>Total Seats</h4>
                        <h2 id="totalSeats">0</h2>
                    </div>

                    <div class="stat-icon">💺</div>

                </div>


                <div class="stat-card">

                    <div>
                        <h4>Registrations</h4>
                        <h2 id="totalRegistrations">0</h2>
                    </div>

                    <div class="stat-icon">🎟️</div>

                </div>


                <div class="stat-card">

                    <div>
                        <h4>Available Seats</h4>
                        <h2 id="availableSeats">0</h2>
                    </div>

                    <div class="stat-icon">✅</div>

                </div>

            </div>


            <div class="panel">

                <div class="panel-header">

                    <h2>Upcoming Events</h2>

                    <button
                        class="btn primary"
                        onclick="showPage('add')">
                        + Create Event
                    </button>

                </div>

                <div id="upcomingEvents"
                     class="events-grid">
                </div>

            </div>

        </section>


        <!-- ================= EVENTS PAGE ================= -->

        <section id="events" class="page">

            <div class="panel">

                <div class="panel-header">

                    <h2>All Events</h2>

                    <button
                        class="btn primary"
                        onclick="showPage('add')">
                        + New Event
                    </button>

                </div>


                <div class="search-area">

                    <input
                        type="text"
                        id="search"
                        placeholder="🔍 Search events..."
                        oninput="displayEvents()">

                    <select
                        id="filterType"
                        onchange="displayEvents()">

                        <option value="all">
                            All Types
                        </option>

                        <option>Conference</option>
                        <option>Workshop</option>
                        <option>Seminar</option>
                        <option>Meeting</option>
                        <option>Cultural Event</option>
                        <option>Sports Event</option>

                    </select>

                </div>


                <div id="eventsContainer"
                     class="events-grid">
                </div>

            </div>

        </section>


        <!-- ================= ADD EVENT ================= -->

        <section id="add" class="page">

            <div class="panel">

                <div class="panel-header">

                    <h2 id="formTitle">
                        Create New Event
                    </h2>

                </div>


                <form id="eventForm">

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Event Name</label>

                            <input
                                type="text"
                                id="eventName"
                                placeholder="Enter event name"
                                required>

                        </div>


                        <div class="form-group">

                            <label>Event Type</label>

                            <select id="eventType" required>

                                <option value="">
                                    Select Event Type
                                </option>

                                <option>Conference</option>
                                <option>Workshop</option>
                                <option>Seminar</option>
                                <option>Meeting</option>
                                <option>Cultural Event</option>
                                <option>Sports Event</option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>Date</label>

                            <input
                                type="date"
                                id="eventDate"
                                required>

                        </div>


                        <div class="form-group">

                            <label>Time</label>

                            <input
                                type="time"
                                id="eventTime"
                                required>

                        </div>


                        <div class="form-group">

                            <label>Venue</label>

                            <input
                                type="text"
                                id="venue"
                                placeholder="Event venue"
                                required>

                        </div>


                        <div class="form-group">

                            <label>Organizer</label>

                            <input
                                type="text"
                                id="organizer"
                                placeholder="Organizer name"
                                required>

                        </div>


                        <div class="form-group">

                            <label>Available Seats</label>

                            <input
                                type="number"
                                id="seats"
                                min="1"
                                placeholder="Number of seats"
                                required>

                        </div>


                        <div class="form-group">

                            <label>Event Category</label>

                            <select id="category">

                                <option>Public</option>
                                <option>Private</option>
                                <option>College</option>
                                <option>Corporate</option>

                            </select>

                        </div>


                        <div class="form-group full">

                            <label>Description</label>

                            <textarea
                                id="description"
                                placeholder="Describe your event...">
                            </textarea>

                        </div>

                    </div>


                    <br>

                    <button
                        type="submit"
                        class="btn primary"
                        id="saveButton">
                        Create Event
                    </button>

                    <button
                        type="button"
                        class="btn secondary"
                        onclick="clearForm()">
                        Clear
                    </button>

                </form>

            </div>

        </section>


        <!-- ================= REGISTRATIONS ================= -->

        <section id="registrations" class="page">

            <div class="panel">

                <div class="panel-header">

                    <h2>Registration Overview</h2>

                </div>

                <div id="registrationList"></div>

            </div>

        </section>

    </div>

</main>


<!-- ================= DETAILS MODAL ================= -->

<div id="detailsModal" class="modal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()">
            ×
        </button>

        <h2 id="modalTitle"></h2>

        <br>

        <div id="modalContent"></div>

    </div>

</div>


<!-- ================= TOAST ================= -->

<div id="toast" class="toast"></div>


<script>

/* =====================================================
   EVENT DATABASE
===================================================== */

let events =
    JSON.parse(localStorage.getItem("eventHubData")) || [];

let editIndex = -1;


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page,button){

    document
        .querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));

    document
        .getElementById(page)
        .classList.add("active");


    document
        .querySelectorAll(".sidebar button")
        .forEach(b => b.classList.remove("active"));

    if(button){
        button.classList.add("active");
    }


    let titles = {

        dashboard:"Dashboard",

        events:"Event Management",

        add:"Create Event",

        registrations:"Registrations"

    };


    document
        .getElementById("pageTitle")
        .innerText = titles[page];


    if(page === "events"){
        displayEvents();
    }

    if(page === "dashboard"){
        displayUpcoming();
    }

    if(page === "registrations"){
        displayRegistrations();
    }

}


/* =====================================================
   CREATE / UPDATE EVENT
===================================================== */

document
    .getElementById("eventForm")
    .addEventListener("submit",function(e){

        e.preventDefault();


        let data = {

            id:
                editIndex === -1
                ? Date.now()
                : events[editIndex].id,

            name:
                document.getElementById("eventName").value,

            type:
                document.getElementById("eventType").value,

            date:
                document.getElementById("eventDate").value,

            time:
                document.getElementById("eventTime").value,

            venue:
                document.getElementById("venue").value,

            organizer:
                document.getElementById("organizer").value,

            seats:
                Number(document.getElementById("seats").value),

            category:
                document.getElementById("category").value,

            description:
                document.getElementById("description").value,

            registered:
                editIndex === -1
                ? 0
                : events[editIndex].registered

        };


        if(editIndex === -1){

            events.push(data);

            showToast(
                "Event created successfully ✓"
            );

        }else{

            events[editIndex] = data;

            showToast(
                "Event updated successfully ✓"
            );

            editIndex = -1;

        }


        saveData();

        clearForm();

        updateDashboard();

        displayEvents();

        displayUpcoming();

        showPage("events");

    });


/* =====================================================
   DISPLAY EVENTS
===================================================== */

function displayEvents(){

    let container =
        document.getElementById("eventsContainer");

    let search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    let filter =
        document
        .getElementById("filterType")
        .value;


    let filtered =
        events.filter(event =>

            event.name
            .toLowerCase()
            .includes(search)

            &&

            (
                filter === "all"
                ||
                event.type === filter
            )

        );


    if(filtered.length === 0){

        container.innerHTML =
            "<p>No events found.</p>";

        return;

    }


    container.innerHTML =
        filtered.map(event => {

            let index =
                events.findIndex(
                    e => e.id === event.id
                );

            return createEventCard(
                event,
                index
            );

        }).join("");

}


/* =====================================================
   EVENT CARD
===================================================== */

function createEventCard(event,index){

    let remaining =
        event.seats - event.registered;


    let status =
        getEventStatus(event.date);


    return `

        <div class="event-card">

            <div class="event-top">

                <span class="badge">
                    ${status}
                </span>

                <h3>
                    ${event.name}
                </h3>

                <small>
                    ${event.type}
                </small>

            </div>


            <div class="event-info">

                <div class="info">
                    📅 <strong>Date:</strong>
                    ${event.date}
                </div>

                <div class="info">
                    🕐 <strong>Time:</strong>
                    ${event.time}
                </div>

                <div class="info">
                    📍 <strong>Venue:</strong>
                    ${event.venue}
                </div>

                <div class="info">
                    👤 <strong>Organizer:</strong>
                    ${event.organizer}
                </div>

                <div class="info">
                    🎟️ <strong>Available:</strong>
                    ${remaining}/${event.seats}
                </div>


                <div class="event-actions">

                    <button
                        class="register"
                        onclick="registerEvent(${index})">
                        Register
                    </button>

                    <button
                        class="details"
                        onclick="viewDetails(${index})">
                        View
                    </button>

                    <button
                        class="edit"
                        onclick="editEvent(${index})">
                        Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteEvent(${index})">
                        Delete
                    </button>

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   EVENT STATUS
===================================================== */

function getEventStatus(date){

    let today =
        new Date()
        .toISOString()
        .split("T")[0];


    if(date === today){
        return "TODAY";
    }

    if(date > today){
        return "UPCOMING";
    }

    return "COMPLETED";

}


/* =====================================================
   REGISTER
===================================================== */

function registerEvent(index){

    let event = events[index];


    if(event.registered >= event.seats){

        showToast(
            "No seats available for this event."
        );

        return;

    }


    let name =
        prompt("Enter attendee name:");


    if(!name){
        return;
    }


    event.registered++;


    saveData();

    updateDashboard();

    displayEvents();

    displayUpcoming();

    showToast(
        "Registration successful for " + name
    );

}


/* =====================================================
   EDIT EVENT
===================================================== */

function editEvent(index){

    let event = events[index];


    document.getElementById("eventName").value =
        event.name;

    document.getElementById("eventType").value =
        event.type;

    document.getElementById("eventDate").value =
        event.date;

    document.getElementById("eventTime").value =
        event.time;

    document.getElementById("venue").value =
        event.venue;

    document.getElementById("organizer").value =
        event.organizer;

    document.getElementById("seats").value =
        event.seats;

    document.getElementById("category").value =
        event.category || "Public";

    document.getElementById("description").value =
        event.description;


    editIndex = index;


    document.getElementById("formTitle").innerText =
        "Edit Event";

    document.getElementById("saveButton").innerText =
        "Update Event";


    showPage("add");

}


/* =====================================================
   DELETE
===================================================== */

function deleteEvent(index){

    let event = events[index];


    if(
        confirm(
            `Delete "${event.name}"?\n\nThis action cannot be undone.`
        )
    ){

        events.splice(index,1);

        saveData();

        updateDashboard();

        displayEvents();

        displayUpcoming();

        showToast(
            "Event deleted successfully."
        );

    }

}


/* =====================================================
   VIEW DETAILS
===================================================== */

function viewDetails(index){

    let event = events[index];


    document
        .getElementById("modalTitle")
        .innerText = event.name;


    document
        .getElementById("modalContent")
        .innerHTML = `

            <p><strong>Event Type:</strong>
            ${event.type}</p>

            <br>

            <p><strong>Date:</strong>
            ${event.date}</p>

            <br>

            <p><strong>Time:</strong>
            ${event.time}</p>

            <br>

            <p><strong>Venue:</strong>
            ${event.venue}</p>

            <br>

            <p><strong>Organizer:</strong>
            ${event.organizer}</p>

            <br>

            <p><strong>Category:</strong>
            ${event.category}</p>

            <br>

            <p><strong>Seats:</strong>
            ${event.seats}</p>

            <br>

            <p><strong>Registered:</strong>
            ${event.registered}</p>

            <br>

            <p>
                <strong>Description:</strong><br>
                ${event.description || "No description provided."}
            </p>

        `;


    document
        .getElementById("detailsModal")
        .classList.add("show");

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document
        .getElementById("detailsModal")
        .classList.remove("show");

}


/* =====================================================
   UPCOMING EVENTS
===================================================== */

function displayUpcoming(){

    let container =
        document.getElementById("upcomingEvents");


    let upcoming =
        events
        .filter(event =>
            event.date >=
            new Date()
            .toISOString()
            .split("T")[0]
        )
        .slice(0,3);


    if(upcoming.length === 0){

        container.innerHTML =
            "<p>No upcoming events.</p>";

        return;

    }


    container.innerHTML =
        upcoming.map(event => {

            let index =
                events.findIndex(
                    e => e.id === event.id
                );

            return createEventCard(
                event,
                index
            );

        }).join("");

}


/* =====================================================
   REGISTRATION PAGE
===================================================== */

function displayRegistrations(){

    let container =
        document.getElementById("registrationList");


    if(events.length === 0){

        container.innerHTML =
            "<p>No registrations yet.</p>";

        return;

    }


    container.innerHTML =
        events.map(event => `

            <div style="
                padding:15px;
                border-bottom:1px solid #eee;
                display:flex;
                justify-content:space-between;
                align-items:center;
            ">

                <div>

                    <strong>
                        ${event.name}
                    </strong>

                    <br>

                    <small>
                        ${event.date} |
                        ${event.venue}
                    </small>

                </div>

                <strong>
                    ${event.registered}
                    /${event.seats}
                </strong>

            </div>

        `).join("");

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

    let totalSeats = 0;
    let registered = 0;


    events.forEach(event => {

        totalSeats += event.seats;

        registered += event.registered;

    });


    document
        .getElementById("totalEvents")
        .innerText = events.length;


    document
        .getElementById("totalSeats")
        .innerText = totalSeats;


    document
        .getElementById("totalRegistrations")
        .innerText = registered;


    document
        .getElementById("availableSeats")
        .innerText =
            totalSeats - registered;

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    document
        .getElementById("eventForm")
        .reset();


    editIndex = -1;


    document
        .getElementById("formTitle")
        .innerText =
            "Create New Event";


    document
        .getElementById("saveButton")
        .innerText =
            "Create Event";

}


/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

    localStorage.setItem(
        "eventHubData",
        JSON.stringify(events)
    );

}


/* =====================================================
   TOAST MESSAGE
===================================================== */

function showToast(message){

    let toast =
        document.getElementById("toast");


    toast.innerText = message;

    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove("show");

    },3000);

}


/* =====================================================
   INITIAL LOAD
===================================================== */

updateDashboard();

displayUpcoming();

</script>

</body>
</html>
